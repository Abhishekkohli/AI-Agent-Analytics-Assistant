# Render Blueprint — connect this repo in the dashboard (New > Blueprint).
# Stable URL: https://<name below>.onrender.com (unchanged unless you rename/delete the service).
services:
  - type: web
    name: ai-analytics-assistant
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_STATIC
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: GROQ_API_KEY
        sync: false
